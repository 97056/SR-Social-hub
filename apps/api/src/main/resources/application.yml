spring:
  application:
    name: sociallink-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sociallink}
    username: ${DATABASE_USERNAME:sociallink}
    password: ${DATABASE_PASSWORD:change-me}
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} %msg%n"

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  session-secret: ${SESSION_SECRET:}
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  cookie:
    secure: false
  worker:
    enabled: true
  publishing:
    sandbox: false
  dev:
    expose-email-outbox: false
  initial-super-admin-email: ${INITIAL_SUPER_ADMIN_EMAIL:}
  initial-super-admin-password: ${INITIAL_SUPER_ADMIN_PASSWORD:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    bucket: ${OBJECT_STORAGE_BUCKET:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
  email:
    api-key: ${EMAIL_PROVIDER_API_KEY:}
  sentry-dsn: ${SENTRY_DSN:}
